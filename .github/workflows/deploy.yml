name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  image:
    name: Build and push image
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${IMAGE,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: image
    # Skipped until the EC2_HOST repository variable is set (see docs/deployment/aws-ec2.md).
    if: github.ref == 'refs/heads/main' && vars.EC2_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ vars.EC2_HOST }}
      USER: ${{ vars.EC2_USER || 'ubuntu' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Deploy
        run: |
          scp -i ~/.ssh/ec2.pem scripts/deploy/remote-deploy.sh "$USER@$HOST:/tmp/remote-deploy.sh"
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/ec2.pem "$USER@$HOST" \
            "bash /tmp/remote-deploy.sh '${{ needs.image.outputs.tag }}' '${{ github.actor }}'"
      - name: Check the site responds
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$HOST/" || true)
            [ "$code" = "200" ] && { echo "Site is up (HTTP 200)"; exit 0; }
            sleep 5
          done
          echo "Site did not return 200 (last: $code)"; exit 1
      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/ec2.pem
